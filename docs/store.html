<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.png" />
  <title>FinOS app store</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html"><span class="dot"></span>FinOS</a>
        <nav>
      <a href="index.html">Home</a>
      <a href="install.html">Install</a>
      <a href="flash.html">Flasher</a>
      <a class="active" href="store.html">App store</a>
      <a href="phone.html">Phone</a>
      <a href="qfin.html">qFin</a>
    </nav>
  </header>
  <main class="page">
    <div class="kicker">.tapp JSON apps</div>
    <h1>Install apps<br/>over USB.</h1>
    <p class="lede">
      Pick an app, connect a T-Embed that is already running FinOS, and push it straight
      into <code>/ext/apps</code>. No reflash. You can also download the file or sideload your own.
    </p>
    <div class="row">
      <button class="btn" id="connect" type="button">Connect device</button>
      <input id="filter" placeholder="Search apps" />
      <label class="btn ghost">Sideload .tapp<input id="upload" type="file" accept=".tapp,.json" hidden /></label>
      <button class="btn ghost" id="submit" type="button">Submit an app</button>
    </div>
    <div class="store-grid" id="grid"></div>
    <h2 style="margin-top:28px">Log</h2>
    <div class="log" id="log"></div>
  </main>
  <script type="module" src="js/store.js"></script>
</body>
</html>
